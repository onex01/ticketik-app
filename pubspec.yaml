name: ticketik_app
description: "Ticketik – a quick form for submitting a support request."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3 # Для push-уведомлений на Android
  # Утилиты
  network_info_plus: ^6.1.0
  device_info_plus: ^10.1.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2 # Чтобы запоминать Device ID
  intl: ^0.19.0 # Для форматирования даты

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true